[package]
org = "zed-pkg"
name = "zed-lib-core"
version = "0.1.0"
description = "Shared client, server, edge, and isomorphic zed-pkg behavior with dual-source parity evidence"
license = "MIT"
keywords = ["package-manager", "resolution", "registry", "polyglot", "validation"]

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg/zed-lib-core"

[dependencies]
"zed-pkg/zed-interfaces" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -f \"$ZED_PKG_TEST_TARGET/conformance/cases/version-resolution.json\""
exclude = [
  ".env",
  ".env.*",
  "env/dec/**",
  ".direnv/**",
  ".vendor/.zed/**",
  ".zed/**",
  ".zed-pack/**",
  "target/**",
  "**/target/**",
  "**/node_modules/**",
  "**/.dart_tool/**",
  "src/rust-orm/**",
  "tmp/**",
  "**/*.log",
  ".DS_Store",
]

[install]
dir = ".vendor/.zed"

[targets.repository]
dir = "."

[targets.rust]
dir = "src/rust"
adapter = "rust"

[targets.rust.native]
registry = "crates-io"
package = "zed-lib"

[targets.conformance]
dir = "conformance"
name = "zed-lib-conformance"
adapter = "none"

[targets.dart]
dir = "src/dart"
adapter = "dart"

[targets.dart.native]
registry = "pub.dev"
package = "zed_lib"
tag_format = "dart/v{version}"

[targets.typescript]
dir = "src/ts"
name = "zed-lib-typescript"
adapter = "node"

[targets.typescript.native]
registry = "npm"
package = "@zed-pkg/zed-lib"
tag_format = "ts/v{version}"

[scripts]
test = "cargo test --all-targets --locked"
boundary = "rustc --edition=2021 -D warnings tools/core-contract-guard.rs -o /tmp/core-contract-guard && /tmp/core-contract-guard --kind lib-core"
release-gate = "rustc --edition=2021 -D warnings tools/core-contract-guard.rs -o /tmp/core-contract-guard && /tmp/core-contract-guard --kind lib-core --require-evidence"
