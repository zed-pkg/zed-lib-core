[package]
org = "zed-pkg"
name = "zed-lib-core"
version = "0.1.0"
description = "Canonical zed-pkg core: SeaORM registry entities, migrations, the role-aware query boundary, polyglot resolution slices, local kernel locks, and shared fenced distributed leases"
license = "MIT"
keywords = ["package-manager", "resolution", "registry", "seaorm", "polyglot", "locking"]

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg/zed-lib-core"

[dependencies]
"zed-pkg/zed-interfaces" = "^0.1.0"
"oresoftware/ores-locks-and-leases" = "=0.1.1"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -f \"$ZED_PKG_TEST_TARGET/conformance/cases/version-resolution.json\""
exclude = [
  ".env",
  ".env.*",
  ".direnv/**",
  ".vendor/.zed/**",
  ".zed/**",
  ".zed-pack/**",
  "target/**",
  "**/target/**",
  "**/node_modules/**",
  "**/.dart_tool/**",
  # The ORM and schema are standalone nested packages. Keep their package
  # metadata out of the whole-repository artifact.
  "src/rust-orm/.zpkg.toml",
  "src/rust-orm/LICENSE",
  "src/rust-orm/README.md",
  "src/rust-orm/orm-package-smoke.sh",
  # `zed-schema` is a standalone nested package. Keep its package metadata out
  # of the whole-repository artifact.
  "src/rust-orm/sql/.zpkg.toml",
  "src/rust-orm/sql/LICENSE",
  "src/rust-orm/sql/README.md",
  "src/rust-orm/sql/schema-package-smoke.sh",
  # `zed-lock` is a standalone nested package too (folded from zed-pkg/zed-lock).
  "src/rust-lock/.zpkg.toml",
  "src/rust-lock/LICENSE",
  "src/rust-lock/README.md",
  "src/rust-lock/CHANGELOG.md",
  "src/rust-lock/SECURITY.md",
  "src/rust-lock/.github-zed-lock/**",
  "tmp/**",
  "**/*.log",
  ".DS_Store",
]

[install]
dir = ".vendor/.zed"

[targets.repository]
dir = "."

[targets.rust]
dir = "src/rust"
adapter = "rust"

[targets.rust.native]
registry = "crates-io"
package = "zed-lib"

# Local process/kernel exclusion stays separate. Cross-host or TTL-bounded
# coordination must go through oresoftware/ores-locks-and-leases so registry
# publishing, migrations, and singleton jobs share fencing semantics with the
# rest of the fleet.
[targets.rust-lock]
dir = "src/rust-lock"
name = "zed-lock"
adapter = "rust"

[targets.conformance]
dir = "conformance"
name = "zed-lib-conformance"
adapter = "none"

[targets.dart]
dir = "src/dart"
adapter = "dart"

[targets.dart.native]
registry = "pub.dev"
package = "zed_lib"
tag_format = "dart/v{version}"

[targets.typescript]
dir = "src/ts"
name = "zed-lib-typescript"
adapter = "node"

[targets.typescript.native]
registry = "npm"
package = "@zed-pkg/zed-lib"
tag_format = "ts/v{version}"

[scripts]
test = "cargo test --all-targets --locked"
