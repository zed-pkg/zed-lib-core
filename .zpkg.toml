[package]
org = "zed-pkg"
name = "zed-lib"
version = "0.1.0"
description = "Implementations of the zed-pkg interfaces: resolution and policy over the shared contract types"
license = "MIT"
keywords = ["package-manager", "resolution", "implementation", "polyglot"]

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg/zed-lib"

[dependencies]
"zed-pkg/zed-interfaces" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -f \"$ZED_PKG_TEST_TARGET/conformance/cases/version-resolution.json\""
exclude = [
  ".env",
  ".env.*",
  ".direnv/**",
  ".vendor/.zed/**",
  ".zed/**",
  ".zed-pack/**",
  "target/**",
  "**/target/**",
  "**/node_modules/**",
  "**/.dart_tool/**",
  "tmp/**",
  "**/*.log",
  ".DS_Store",
]

[install]
dir = ".vendor/.zed"

# Whole-repository slice: every implementation plus the shared corpus they are
# all verified against.
[targets.repository]
dir = "."
name = "zed-lib-repository"

[targets.rust]
dir = "src/rust"
adapter = "rust"

[targets.rust.native]
registry = "crates-io"
package = "zed-lib"

# The corpus is consumable on its own: an implementation in a language zed-lib
# does not ship yet still has something to be correct against.
[targets.conformance]
dir = "conformance"
name = "zed-lib-conformance"
adapter = "none"

# Dart and TypeScript implementations land under src/dart and src/ts, mirroring
# the slices in zed-interfaces. They are not scaffolded until there is real
# behavior to put in them — an empty package is a promise, not a package.

[scripts]
test = "cargo test --all-targets --locked"
lint = "cargo clippy --all-targets --locked -- -D warnings"
format = "cargo fmt --all -- --check"
