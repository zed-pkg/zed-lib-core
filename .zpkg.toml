[package]
org = "zed-pkg"
name = "zed-lib-core"
version = "0.1.0"
description = "Canonical zed-pkg core: shared client, server, edge, and isomorphic behavior; SeaORM registry entities and migrations; polyglot resolution slices; and the kernel-backed local lock crate"
license = "MIT"
keywords = ["package-manager", "resolution", "registry", "seaorm", "polyglot", "locking", "validation"]

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg/zed-lib-core"

[dependencies]
"zed-pkg/zed-interfaces" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -f \"$ZED_PKG_TEST_TARGET/conformance/cases/version-resolution.json\""
exclude = [
  ".env",
  ".env.*",
  "env/dec/**",
  ".direnv/**",
  ".vendor/.zed/**",
  ".zed/**",
  ".zed-pack/**",
  "target/**",
  "**/target/**",
  "**/node_modules/**",
  "**/.dart_tool/**",
  # Executable ORM ownership is migrating to the private zed-orm-core family;
  # keep it out of the root publication while the temporary workspace member
  # preserves the audited build during that migration.
  "src/rust-orm/**",
  # The ORM and schema are standalone nested packages. Keep their package
  # metadata out of the whole-repository artifact.
  "src/rust-orm/.zpkg.toml",
  "src/rust-orm/LICENSE",
  "src/rust-orm/README.md",
  "src/rust-orm/orm-package-smoke.sh",
  # `zed-schema` is a standalone nested package. Keep its package metadata out
  # of the whole-repository artifact.
  "src/rust-orm/sql/.zpkg.toml",
  "src/rust-orm/sql/LICENSE",
  "src/rust-orm/sql/README.md",
  "src/rust-orm/sql/schema-package-smoke.sh",
  # `zed-lock` is a standalone nested package too (folded from zed-pkg/zed-lock).
  "src/rust-lock/.zpkg.toml",
  "src/rust-lock/LICENSE",
  "src/rust-lock/README.md",
  "src/rust-lock/CHANGELOG.md",
  "src/rust-lock/SECURITY.md",
  "src/rust-lock/.github-zed-lock/**",
  "tmp/**",
  "**/*.log",
  ".DS_Store",
]

[install]
dir = ".vendor/.zed"

[targets.repository]
dir = "."

[targets.rust]
dir = "src/rust"
adapter = "rust"

[targets.rust.native]
registry = "crates-io"
package = "zed-lib"

# The local lock crate, folded in from zed-pkg/zed-lock. It keeps its crate
# name so consumers change only where they fetch it from; it never depends on
# the ORM slice or on the network. Distributed lease + Postgres advisory
# composition lives in ORESoftware/ores-locks-and-leases, not here.
[targets.rust-lock]
dir = "src/rust-lock"
name = "zed-lock"
adapter = "rust"

# The corpus is consumable on its own: an implementation in a language zed-lib
# does not ship yet still has something to be correct against.
[targets.conformance]
dir = "conformance"
name = "zed-lib-conformance"
adapter = "none"

[targets.dart]
dir = "src/dart"
adapter = "dart"

[targets.dart.native]
registry = "pub.dev"
package = "zed_lib"
tag_format = "dart/v{version}"

[targets.typescript]
dir = "src/ts"
name = "zed-lib-typescript"
adapter = "node"

[targets.typescript.native]
registry = "npm"
package = "@zed-pkg/zed-lib"
tag_format = "ts/v{version}"

[scripts]
test = "cargo test --locked -p zed-lib --all-targets --all-features && cargo test --locked -p zed-lib --all-targets --no-default-features"
boundary = "rustc --edition=2021 -D warnings tools/core-contract-guard.rs -o /tmp/core-contract-guard && /tmp/core-contract-guard --kind lib-core"
release-gate = "rustc --edition=2021 -D warnings tools/core-contract-guard.rs -o /tmp/core-contract-guard && /tmp/core-contract-guard --kind lib-core --require-evidence"
