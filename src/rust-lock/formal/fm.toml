# fmctl schema-v1 manifest for zed-lock's waiter/ownership lifecycle.
schema_version = 1
project = "zed-lock"
model = "waiter-ownership-lifecycle-v1"
language = "quint"
spec = "formal/waiter_lifecycle.qnt"
main = "waiter_lifecycle"
init = "init"
step = "step"
invariants = ["waiter_lifecycle_safety"]
witnesses = [
  "cancel_before_grant_reached",
  "timeout_before_grant_reached",
  "detached_grant_release_reached",
  "successful_transfer_reached",
  "waiter_cap_rejection_reached",
  "same_process_rejection_reached",
  "partial_lockset_unwind_reached",
]

[toolchain]
quint = "0.32.0"
java = ">=17"
node = "22"
rust = "1.88.0"
npx = "npx"

[execution]
timeout_seconds = 600
max_output_bytes = 8388608
artifacts_dir = ".formal-artifacts"

[simulation]
backend = "typescript"
max_samples = 10000
max_steps = 30

[verification]
backend = "tlc"
exhaustive_finite_model = true
