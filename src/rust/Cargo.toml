[package]
name = "zed-lib"
version = "0.1.0"
edition = "2024"
description = "Implementations of the zed-pkg interfaces: resolution and policy over the shared contract types"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-lib-core"

# The Rust slice of a polyglot zed-package; Dart and TypeScript slices land
# beside it under `src/`. See `docs` in zed-interfaces for why the crate
# manifest sits inside its own slice rather than at the repository root.
[lib]
path = "lib.rs"

[dependencies]
# Pin the independently published interface authority so zed-lib is a real
# Cargo git dependency. This reviewed DEN-3282 commit includes the typed
# manifest-authoritative source-composition contract and generated schema on
# top of the previously admitted signing, mirror, binary-artifact, Git CLI
# receipt, and registry transport contracts consumed by clients and zed-cli.
zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "31a7eca1562ce9c6e37afddad1e704b29b213b9e" }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.19"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
