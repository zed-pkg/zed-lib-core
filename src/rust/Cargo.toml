[package]
name = "zed-lib"
version = "0.1.0"
edition = "2024"
description = "Implementations of the zed-pkg interfaces: resolution and policy over the shared contract types"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-lib-core"

# The Rust slice of a polyglot zed-package; Dart and TypeScript slices land
# beside it under `src/`. See `docs` in zed-interfaces for why the crate
# manifest sits inside its own slice rather than at the repository root.
[lib]
path = "lib.rs"

[dependencies]
# Pin the independently published interface authority so zed-lib is a real
# Cargo git dependency. This exact merged commit includes the package-security
# PackageDependencyClosure authority from zed-interfaces#168, including the
# Hex artifact identity strengthened by #167, on top of the previously admitted
# portable contracts consumed by clients and zed-cli.
zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "69ccba03c6a5b23bcb5af63315ef2cc0e7a6a8a5" }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.19"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
