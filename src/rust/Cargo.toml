[package]
name = "zed-lib"
version = "0.1.0"
edition = "2024"
description = "Implementations of the zed-pkg interfaces: resolution and policy over the shared contract types"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-lib-core"

# The Rust slice of a polyglot zed-package; Dart and TypeScript slices land
# beside it under `src/`. See `docs` in zed-interfaces for why the crate
# manifest sits inside its own slice rather than at the repository root.
[lib]
path = "lib.rs"

[dependencies]
# Pin the independently published interface authority so zed-lib is a real
# Cargo git dependency. This reviewed commit includes the signing, mirror,
# binary-artifact, and DEN-3495 Git CLI install receipt contracts consumed by
# zed-clients and zed-cli. The Git install receipt's independent TypeSpec and
# authored Draft 2020-12 JSON Schema authorities are admitted by the pinned
# ORESoftware/typespec-json-schema-validator gate in zed-interfaces.
zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "d11322f06ca6930ddcc34a745b4ef01e0b2bddc1" }
thiserror = "2.0.19"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
