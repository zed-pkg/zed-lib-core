[package]
name = "zed-lib"
version = "0.1.0"
edition = "2024"
description = "Implementations of the zed-pkg interfaces: resolution and policy over the shared contract types"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-lib-core"

# The Rust slice of a polyglot zed-package; Dart and TypeScript slices land
# beside it under `src/`. See `docs` in zed-interfaces for why the crate
# manifest sits inside its own slice rather than at the repository root.
[lib]
path = "lib.rs"

[dependencies]
# Pin the independently published interface authority so zed-lib is a real
# Cargo git dependency. This reviewed commit includes the current admitted
# public contract surface consumed by zed-clients and zed-cli. Its independent
# TypeSpec and authored Draft 2020-12 JSON Schema authorities are admitted by
# the pinned ORESoftware/typespec-json-schema-validator gate in zed-interfaces.
zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "0c2ffa7be791a44c8aa2a69ab4b1ea87aab4729c" }
thiserror = "2.0.19"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
