[package]
name = "zed-lib"
version = "0.1.0"
edition = "2024"
description = "Implementations of the zed-pkg interfaces: resolution and policy over the shared contract types"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-lib-core"

# The Rust slice of a polyglot zed-package; Dart and TypeScript slices land
# beside it under `src/`. See `docs` in zed-interfaces for why the crate
# manifest sits inside its own slice rather than at the repository root.
[lib]
path = "lib.rs"

[dependencies]
# Pin the independently published interface authority so zed-lib is a real
# Cargo git dependency. A sibling-only path made downstream consumers such as
# zed-clients and zed-cli compile only inside specially arranged checkouts.
zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "7d31f80dd8a310f218931165a3ad636a2f32b932" }
thiserror = "2.0.19"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
