# Virtual workspace. The `zed-lib` crate lives in `src/rust/`, leaving room for
# the Dart and TypeScript implementations beside it — the same layout as
# zed-interfaces, and for the same reason: `.zpkg.toml` publishes each language
# slice as its own package, and a target may not own `dir = "."`.
[workspace]
resolver = "3"
members = [
  "src/rust",
  "src/rust-orm",
  "src/rust-lock",
  "validation/rust",
  "validation/rust-server",
]
default-members = ["src/rust", "src/rust-orm", "src/rust-lock"]
[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
# typed errors: panicking is not error handling
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
# illegal states excluded by types
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
# immutable values and pure transformations
mut_mut = "warn"
needless_pass_by_ref_mut = "warn"
# composition
too_many_lines = "warn"
cognitive_complexity = "warn"
module_name_repetitions = "allow"
# explicit inputs and outputs
must_use_candidate = "warn"
return_self_not_must_use = "warn"
