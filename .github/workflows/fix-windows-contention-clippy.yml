name: apply Windows contention Clippy repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-windows-contention-clippy.yml
      - src/lib.rs

permissions:
  contents: write

concurrency:
  group: fix-windows-contention-clippy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/windows-lock-violation-contention'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/windows-lock-violation-contention
          persist-credentials: true
          show-progress: false

      - name: Install Rust quality components
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Apply the exact platform-specific Clippy suggestion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib.rs')
          text = path.read_text()
          old = '        return error.raw_os_error() == Some(33);\n'
          new = '        error.raw_os_error() == Some(33)\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Windows contention expression not found')
          path.write_text(text)
          PY

      - name: Validate all ordinary package surfaces
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: Commit ordinary source and remove carrier
        run: |
          set -euo pipefail
          rm .github/workflows/fix-windows-contention-clippy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib.rs .github/workflows/fix-windows-contention-clippy.yml
          git diff --cached --check
          git commit -m 'fix(DEN-3167): satisfy Windows contention Clippy'
          git push origin HEAD:fix/windows-lock-violation-contention
