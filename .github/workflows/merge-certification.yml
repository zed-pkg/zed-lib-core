name: semantic merge certification

on:
  pull_request:
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'MERGE_PROVENANCE.md'
      - 'ROUTES.md'
      - 'contracts/api-routes.v1.json'
      - 'shared-defs.lock.json'
      - 'scripts/check-merge-contract.py'
      - 'src/rust-orm/**'
      - '.github/workflows/merge-certification.yml'
  push:
    branches: [main]
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'MERGE_PROVENANCE.md'
      - 'ROUTES.md'
      - 'contracts/api-routes.v1.json'
      - 'shared-defs.lock.json'
      - 'scripts/check-merge-contract.py'
      - 'src/rust-orm/**'
      - '.github/workflows/merge-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Certify source histories, shared schema, Zed package, API routes and R2 boundary
        run: |
          python3 -m py_compile scripts/check-merge-contract.py
          python3 scripts/check-merge-contract.py
      - name: Validate route contract JSON
        run: python3 -m json.tool contracts/api-routes.v1.json >/dev/null
      - name: Validate both ORM feature surfaces
        run: |
          cargo fmt --manifest-path src/rust-orm/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path src/rust-orm/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path src/rust-orm/Cargo.toml --all-targets
          cargo test --locked --manifest-path src/rust-orm/Cargo.toml --all-targets --all-features
          cargo test --locked --manifest-path src/rust-orm/Cargo.toml --doc
      - name: Ensure release provenance is never fabricated
        shell: bash
        run: |
          set -euo pipefail
          if test -f .zpkg.lock; then
            python3 - <<'PY'
          import pathlib
          import re
          import tomllib
          lock = tomllib.loads(pathlib.Path('.zpkg.lock').read_text())
          packages = lock.get('package', [])
          assert packages
          for package in packages:
              assert re.fullmatch(r'[0-9a-f]{64}', package['sha256'])
              assert package['sha256'] != '0' * 64
              assert package['size'] > 0
              assert package['format'] in {'tar.gz', 'tar.zst', 'zip'}
              assert re.fullmatch(r'[0-9a-f]{40}', package['vcs_commit'])
              assert package['vcs_tag']
              assert package['source']
          PY
          else
            echo 'No .zpkg.lock is committed; release remains blocked on real immutable resolution.'
          fi
          git diff --check
