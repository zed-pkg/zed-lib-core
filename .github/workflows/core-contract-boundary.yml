name: core-contract-boundary

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: core-contract-boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Compile and test guard
        run: |
          rustc +1.88.0 --edition=2021 --test tools/core-contract-guard.rs -o /tmp/core-contract-guard-tests
          /tmp/core-contract-guard-tests
          rustc +1.88.0 --edition=2021 -D warnings tools/core-contract-guard.rs -o /tmp/core-contract-guard
      - name: Validate lib-core bootstrap boundary
        run: /tmp/core-contract-guard --kind lib-core
      - name: Reject raw env access from shared surfaces
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'std::env::(var|vars)|process\.env|Deno\.env|Bun\.env|Platform\.environment|System\.getenv|os\.Getenv' client edge isomorph; then
            echo 'client/edge/isomorph must accept typed public configuration inward' >&2
            exit 1
          fi
      - name: Reject plaintext environment files
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)(\.env($|\.)|env/dec/)' | grep -vE '(^|/)\.env\.example$' || true)"
          test -z "$bad" || { printf 'plaintext environment paths are forbidden:\n%s\n' "$bad" >&2; exit 1; }
      - name: Require complete release evidence
        if: startsWith(github.ref, 'refs/tags/')
        run: /tmp/core-contract-guard --kind lib-core --require-evidence
