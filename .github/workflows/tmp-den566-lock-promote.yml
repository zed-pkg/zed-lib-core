# Temporary trusted-branch Cargo lock promotion. Remove after the generated lock is committed.
name: tmp-den566-lock-promote
on:
  push:
    branches: [den-566-ores-locks-adoption]
    paths:
      - '.github/workflows/tmp-den566-lock-promote.yml'
      - 'Cargo.toml'
      - 'src/rust/Cargo.toml'
      - '.zpkg.toml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: den-566-ores-locks-adoption
          persist-credentials: true
      - name: Assert trusted branch
        run: test "$(git branch --show-current)" = "den-566-ores-locks-adoption"
      - name: Generate and validate Cargo lock graph
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo metadata --locked --no-deps >/dev/null
          test -z "$(git diff --name-only -- . ':!Cargo.lock')"
      - name: Commit only Cargo.lock
        run: |
          set -euo pipefail
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already current"
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "Cargo.lock"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'DEN-566 refresh Cargo.lock for shared locks adoption'
          git push origin HEAD:den-566-ores-locks-adoption
