name: fp-conformance

# Functional-programming conformance ratchet.
#
# The scanner is a zero-dependency Rust tool. Pull requests compare the exact
# contributor head against the exact PR base with the same binary, so inherited
# backlog never blocks unrelated work while any per-rule count increase fails.
# Pushes compare against the pushed-from commit (or HEAD^ when unavailable).

on:
  pull_request:
    paths:
      - '**.rs'
      - '**.ts'
      - '**.tsx'
      - '**.mts'
      - '**.cts'
      - '**.dart'
      - 'tools/fp-conformance/**'
      - '.github/workflows/fp-conformance.yml'
      - 'FP-GUIDELINES.md'
      - 'agents.md'
  push:
    branches: [main, dev]
    paths:
      - '**.rs'
      - '**.ts'
      - '**.tsx'
      - '**.mts'
      - '**.cts'
      - '**.dart'
      - 'tools/fp-conformance/**'
      - '.github/workflows/fp-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fp-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  conformance:
    name: functional programming conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Verify exact contributor head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Format scanner
        run: cargo fmt --manifest-path tools/fp-conformance/Cargo.toml --all -- --check

      - name: Test scanner
        run: cargo test --manifest-path tools/fp-conformance/Cargo.toml --locked

      - name: Clippy scanner
        run: cargo clippy --manifest-path tools/fp-conformance/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build scanner once
        run: cargo build --manifest-path tools/fp-conformance/Cargo.toml --locked

      - name: Scan exact base and exact contributor head
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base_sha}^{commit}"

          base_tree="$RUNNER_TEMP/fp-base"
          trap 'git worktree remove "$base_tree" >/dev/null 2>&1 || true' EXIT
          git worktree add --detach "$base_tree" "$base_sha"

          scanner="$PWD/tools/fp-conformance/target/debug/fp-conformance"
          "$scanner" "$base_tree"             --json "$RUNNER_TEMP/fp-base.json"             --quiet

          "$scanner" .             --json fp-findings.json             --compare-json "$RUNNER_TEMP/fp-base.json"             --limit 60

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fp-findings
          path: fp-findings.json
          if-no-files-found: ignore
          retention-days: 14
