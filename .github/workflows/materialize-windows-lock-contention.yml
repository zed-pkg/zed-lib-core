name: materialize Windows lock contention classification

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-windows-lock-contention.yml
      - src/lib.rs
      - CHANGELOG.md

permissions:
  contents: write

concurrency:
  group: materialize-windows-lock-contention
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/windows-lock-violation-contention'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/windows-lock-violation-contention
          persist-credentials: true
          show-progress: false

      - name: Install Rust quality components
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Treat ERROR_LOCK_VIOLATION as ordinary contention
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib.rs')
          text = path.read_text()

          impl_anchor = '''impl Default for LockManager {
              fn default() -> Self {
                  LockManagerBuilder::default().build()
              }
          }

          impl LockManager {
          '''
          helper = '''impl Default for LockManager {
              fn default() -> Self {
                  LockManagerBuilder::default().build()
              }
          }

          fn is_lock_contention(error: &std::io::Error) -> bool {
              if error.kind() == std::io::ErrorKind::WouldBlock {
                  return true;
              }

              #[cfg(windows)]
              {
                  // LockFileEx reports ordinary nonblocking contention through
                  // ERROR_LOCK_VIOLATION (33), which Rust currently classifies as
                  // `Other` rather than `WouldBlock`.
                  return error.raw_os_error() == Some(33);
              }

              #[cfg(not(windows))]
              {
                  false
              }
          }

          impl LockManager {
          '''
          if impl_anchor not in text:
              raise SystemExit('LockManager helper insertion anchor not found')
          text = text.replace(impl_anchor, helper, 1)

          old_guard = '            Err(error) if error.kind() == std::io::ErrorKind::WouldBlock => {'
          new_guard = '            Err(error) if is_lock_contention(&error) => {'
          if old_guard not in text:
              raise SystemExit('try_acquire contention guard not found')
          text = text.replace(old_guard, new_guard, 1)

          old_import = '''    use super::{LockClass, LockEventKind, LockManager, LockRequest, LockWaiter, lock_unpoison};
          '''
          new_import = '''    use super::{
              LockClass, LockEventKind, LockManager, LockRequest, LockWaiter, is_lock_contention,
              lock_unpoison,
          };
          '''
          if old_import not in text:
              raise SystemExit('test import anchor not found')
          text = text.replace(old_import, new_import, 1)

          test_anchor = '''    #[test]
              fn default_policy_rejects_same_process_reentry() -> Result<()> {
          '''
          tests = '''    #[test]
              fn would_block_is_classified_as_lock_contention() {
                  let error = std::io::Error::from(std::io::ErrorKind::WouldBlock);
                  assert!(is_lock_contention(&error));
              }

              #[test]
              fn unrelated_io_errors_are_not_lock_contention() {
                  let error = std::io::Error::from(std::io::ErrorKind::PermissionDenied);
                  assert!(!is_lock_contention(&error));
              }

              #[cfg(windows)]
              #[test]
              fn windows_lock_violation_is_classified_as_contention() {
                  let error = std::io::Error::from_raw_os_error(33);
                  assert!(is_lock_contention(&error));
              }

              #[test]
              fn default_policy_rejects_same_process_reentry() -> Result<()> {
          '''
          if test_anchor not in text:
              raise SystemExit('contention test insertion anchor not found')
          path.write_text(text.replace(test_anchor, tests, 1))

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          marker = '# Changelog\n\n'
          entry = '''# Changelog

          ## Unreleased

          - Classify Windows `LockFileEx` error 33 (`ERROR_LOCK_VIOLATION`) as
            ordinary nonblocking contention, returning `Ok(None)` from
            `LockManager::try_acquire` instead of a hard I/O error.
          - Retain `WouldBlock` behavior on every platform and continue to surface
            unrelated I/O failures.

          '''
          if '## Unreleased' not in text:
              if marker not in text:
                  raise SystemExit('changelog heading not found')
              changelog.write_text(text.replace(marker, entry, 1))
          PY

      - name: Validate ordinary source
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit product patch and remove carrier
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-windows-lock-contention.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib.rs CHANGELOG.md .github/workflows/materialize-windows-lock-contention.yml
          git diff --cached --check
          git commit -m 'fix(DEN-3167): classify Windows lock violation as contention'
          git push origin HEAD:fix/windows-lock-violation-contention
