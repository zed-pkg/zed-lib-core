name: materialize Windows lock contention classification

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-windows-lock-contention.yml
      - src/lib.rs
      - CHANGELOG.md

permissions:
  contents: write

concurrency:
  group: materialize-windows-lock-contention
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/windows-lock-violation-contention'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/windows-lock-violation-contention
          persist-credentials: true
          show-progress: false

      - name: Install Rust quality components
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Treat ERROR_LOCK_VIOLATION as ordinary contention
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/lib.rs')
          text = source.read_text()

          helper = '''
          fn is_lock_contention(error: &std::io::Error) -> bool {
              if error.kind() == std::io::ErrorKind::WouldBlock {
                  return true;
              }

              #[cfg(windows)]
              {
                  // LockFileEx reports ordinary nonblocking contention through
                  // ERROR_LOCK_VIOLATION (33), which Rust currently classifies as
                  // `Other` rather than `WouldBlock`.
                  return error.raw_os_error() == Some(33);
              }

              #[cfg(not(windows))]
              {
                  false
              }
          }

          '''
          if 'fn is_lock_contention(error: &std::io::Error) -> bool {' not in text:
              default_start = text.find('impl Default for LockManager {')
              if default_start < 0:
                  raise SystemExit('LockManager Default implementation not found')
              manager_impl = text.find('\nimpl LockManager {', default_start)
              if manager_impl < 0:
                  raise SystemExit('LockManager implementation following Default not found')
              text = text[: manager_impl + 1] + helper + text[manager_impl + 1 :]

          old_guard = 'Err(error) if error.kind() == std::io::ErrorKind::WouldBlock => {'
          new_guard = 'Err(error) if is_lock_contention(&error) => {'
          if old_guard in text:
              text = text.replace(old_guard, new_guard, 1)
          elif new_guard not in text:
              raise SystemExit('try_acquire contention guard not found')

          tests = '''    #[test]
              fn would_block_is_classified_as_lock_contention() {
                  let error = std::io::Error::from(std::io::ErrorKind::WouldBlock);
                  assert!(super::is_lock_contention(&error));
              }

              #[test]
              fn unrelated_io_errors_are_not_lock_contention() {
                  let error = std::io::Error::from(std::io::ErrorKind::PermissionDenied);
                  assert!(!super::is_lock_contention(&error));
              }

              #[cfg(windows)]
              #[test]
              fn windows_lock_violation_is_classified_as_contention() {
                  let error = std::io::Error::from_raw_os_error(33);
                  assert!(super::is_lock_contention(&error));
              }

          '''
          if 'fn would_block_is_classified_as_lock_contention()' not in text:
              first_test = text.find('    #[test]\n    fn repeated_timeouts_keep_one_acquisition_request()')
              if first_test < 0:
                  raise SystemExit('first zed-lock unit test anchor not found')
              text = text[:first_test] + tests + text[first_test:]

          required = [
              'fn is_lock_contention(error: &std::io::Error) -> bool {',
              'Err(error) if is_lock_contention(&error) => {',
              'fn windows_lock_violation_is_classified_as_contention()',
          ]
          missing = [fragment for fragment in required if fragment not in text]
          if missing:
              raise SystemExit(f'missing repaired fragments: {missing}')
          source.write_text(text)

          changelog = Path('CHANGELOG.md')
          change_text = changelog.read_text()
          if 'ERROR_LOCK_VIOLATION' not in change_text:
              heading = '# Changelog\n\n'
              entry = '''# Changelog

          ## Unreleased

          - Classify Windows `LockFileEx` error 33 (`ERROR_LOCK_VIOLATION`) as
            ordinary nonblocking contention, returning `Ok(None)` from
            `LockManager::try_acquire` instead of a hard I/O error.
          - Retain `WouldBlock` behavior on every platform and continue to surface
            unrelated I/O failures.

          '''
              if heading not in change_text:
                  raise SystemExit('changelog heading not found')
              changelog.write_text(change_text.replace(heading, entry, 1))
          PY

      - name: Validate ordinary source
        run: |
          set -euo pipefail
          # zed-lock intentionally does not commit Cargo.lock; validate exactly
          # as the permanent package CI does rather than manufacturing one.
          cargo fmt --all
          cargo fmt --all --check
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: Commit product patch and remove carrier
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-windows-lock-contention.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib.rs CHANGELOG.md .github/workflows/materialize-windows-lock-contention.yml
          git diff --cached --check
          git commit -m 'fix(DEN-3167): classify Windows lock violation as contention'
          git push origin HEAD:fix/windows-lock-violation-contention
