name: DEN-3091 redacted Windows DACL diagnostic

on:
  push:
    branches:
      - agent/den-3091-private-lock-paths

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
      - name: Add a redacted diagnostic only in the runner workspace
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('src/path_security.rs')
          text = path.read_text()
          old = '            bail!("lock path DACL is not user-private; refusing under the private path policy");'
          new = '''            bail!(
                          "lock path DACL is not user-private; observed {}; refusing under the private path policy",
                          sddl.replace(&sid, "<current-user>")
                      );'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one diagnostic anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          '@ | python3 -
      - name: Exercise one native private-open path
        run: cargo test path_security::tests::windows_private_open_uses_non_inheritable_handle -- --nocapture
