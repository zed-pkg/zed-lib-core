name: zed-lock CI and package artifact

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zed-lock-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} conformance
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo test --all-targets -- --nocapture
      - run: cargo clippy --all-targets -- -D warnings

  package:
    name: Package crate and publish release artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Build the exact crate package
        shell: bash
        run: |
          set -euo pipefail
          cargo package
          cp target/package/zed-lock-0.1.0.crate zed-lock-0.1.0.crate
          sha256sum zed-lock-0.1.0.crate > zed-lock-0.1.0.crate.sha256
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zed-lock-0.1.0-${{ github.sha }}
          path: |
            zed-lock-0.1.0.crate
            zed-lock-0.1.0.crate.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish the initial GitHub release idempotently
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 already published'
          else
            gh release create v0.1.0 \
              zed-lock-0.1.0.crate \
              zed-lock-0.1.0.crate.sha256 \
              --title 'zed-lock v0.1.0' \
              --notes 'Initial standalone release of the kernel-backed, event-driven zed-pkg locking crate.'
          fi
