name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: zed-lib
          persist-credentials: false
          show-progress: false

      # The crate depends on zed-interfaces by path, the same way the other
      # Rust repos in this org do. Checking the sibling out here keeps CI
      # building exactly what a developer builds locally, with no vendored copy
      # to drift.
      - name: Check out zed-interfaces
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository_owner }}/zed-interfaces
          path: zed-interfaces
          persist-credentials: false
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Format
        working-directory: zed-lib
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: zed-lib
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: zed-lib
        run: cargo test --locked --all-targets

      - name: Conformance corpus
        working-directory: zed-lib
        run: cargo test --locked --test conformance

      # Rust is the oracle for the generated cases, so a change here can rewrite
      # what Dart and TypeScript are held to. Regenerating must be a no-op.
      - name: Generated corpus is up to date
        working-directory: zed-lib
        run: |
          cargo run --locked --example generate_fuzz_corpus
          git diff --exit-code conformance/ \
            || (echo "conformance/ is stale; run 'cargo run --locked --example generate_fuzz_corpus' and commit" && exit 1)

  # Each implementation slice runs the same corpus. These jobs are what turn
  # "three implementations of one contract" from a claim into a check.
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: zed-lib
          persist-credentials: false
          show-progress: false

      - name: Check out zed-interfaces
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository_owner }}/zed-interfaces
          path: zed-interfaces
          persist-credentials: false
          show-progress: false

      - name: Install Dart SDK
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1

      - name: Resolve dependencies
        working-directory: zed-lib/src/dart
        run: dart pub get

      - name: Analyze
        working-directory: zed-lib/src/dart
        run: dart analyze --fatal-infos

      - name: Conformance corpus
        working-directory: zed-lib/src/dart
        run: dart test

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: zed-lib
          persist-credentials: false
          show-progress: false

      - name: Check out zed-interfaces
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository_owner }}/zed-interfaces
          path: zed-interfaces
          persist-credentials: false
          show-progress: false

      - name: Install dependencies
        working-directory: zed-lib/src/ts
        run: |
          npm install
          npm install --no-save typescript@5 @types/node

      - name: Typecheck
        working-directory: zed-lib/src/ts
        run: npx tsc --noEmit

      # Node strips the types, so the corpus runs against the shipped source
      # rather than a build artifact.
      - name: Conformance corpus
        working-directory: zed-lib/src/ts
        run: node --test conformance.test.ts
