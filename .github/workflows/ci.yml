name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_INTERFACES_POLYGLOT_REF: 7d31f80dd8a310f218931165a3ad636a2f32b932

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: zed-lib
          persist-credentials: false
          show-progress: false

      # zed-lib is a three-language behavior suite. Pin the exact merged
      # zed-interfaces commit whose Rust, TypeScript, Dart, and generated-schema
      # surfaces define the shared namespace contract under test.
      - name: Check out merged polyglot zed-interfaces contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository_owner }}/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_POLYGLOT_REF }}
          path: zed-interfaces
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify immutable interfaces pin
        run: test "$(git -C zed-interfaces rev-parse HEAD)" = "$ZED_INTERFACES_POLYGLOT_REF"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Verify zed-orm-core as a Git dependency
        working-directory: zed-lib
        run: |
          consumer="$RUNNER_TEMP/zed-orm-core-consumer"
          mkdir -p "$consumer/src"
          printf '%s\n' \
            '[package]' \
            'name = "zed-orm-core-consumer"' \
            'version = "0.0.0"' \
            'edition = "2021"' \
            '' \
            '[dependencies]' \
            "zed-orm-core = { git = \"file://$GITHUB_WORKSPACE/zed-lib\", rev = \"$(git rev-parse HEAD)\" }" \
            > "$consumer/Cargo.toml"
          printf '%s\n' 'fn main() {}' > "$consumer/src/main.rs"
          cargo generate-lockfile --manifest-path "$consumer/Cargo.toml"
          cargo check --locked --manifest-path "$consumer/Cargo.toml"

      - name: Format
        working-directory: zed-lib
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: zed-lib
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: zed-lib
        run: cargo test --locked --all-targets

      - name: Schema-aware conformance corpus
        working-directory: zed-lib
        run: cargo test --locked --test conformance

      # Rust is the oracle for generated version cases. Regeneration must leave
      # the version files unchanged and must not consume the namespace corpus.
      - name: Generated version corpus is up to date
        working-directory: zed-lib
        run: |
          cargo run --locked --example generate_fuzz_corpus
          git diff --exit-code conformance/ \
            || (echo "generated version corpus is stale; regenerate and commit" && exit 1)

  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: zed-lib
          persist-credentials: false
          show-progress: false

      - name: Check out merged polyglot zed-interfaces contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository_owner }}/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_POLYGLOT_REF }}
          path: zed-interfaces
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify immutable interfaces pin
        run: test "$(git -C zed-interfaces rev-parse HEAD)" = "$ZED_INTERFACES_POLYGLOT_REF"

      - name: Install Dart SDK
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1

      - name: Resolve dependencies
        working-directory: zed-lib/src/dart
        run: dart pub get

      - name: Analyze
        working-directory: zed-lib/src/dart
        run: dart analyze --fatal-infos

      - name: Run all behavior and conformance tests
        working-directory: zed-lib/src/dart
        run: dart test

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: zed-lib
          persist-credentials: false
          show-progress: false

      - name: Check out merged polyglot zed-interfaces contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository_owner }}/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_POLYGLOT_REF }}
          path: zed-interfaces
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify immutable interfaces pin
        run: test "$(git -C zed-interfaces rev-parse HEAD)" = "$ZED_INTERFACES_POLYGLOT_REF"

      - name: Install dependencies
        working-directory: zed-lib/src/ts
        run: |
          npm install
          npm install --no-save typescript@5 @types/node

      - name: Typecheck
        working-directory: zed-lib/src/ts
        run: npx tsc --noEmit

      - name: Run all behavior and conformance tests
        working-directory: zed-lib/src/ts
        run: npm test
