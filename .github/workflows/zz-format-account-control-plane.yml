name: format and validate account control plane

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-account-control-plane
  cancel-in-progress: false

env:
  ZED_INTERFACES_POLYGLOT_REF: 6ad1ad3c0584a60778bf0d451d9d091ad90e6c0c

jobs:
  format-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/den-2788-account-control-plane-ops
          path: zed-lib
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - name: Check out the immutable polyglot interface contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_POLYGLOT_REF }}
          path: zed-interfaces
          persist-credentials: false
          show-progress: false
      - name: Install the certified Rust toolchain surface
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy
      - name: Apply assertion-checked Clippy repairs
        working-directory: zed-lib
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for relative in ("src/rust-orm/account.rs", "src/rust-orm/publication.rs"):
              path = Path(relative)
              text = path.read_text()
              old = "value.as_bytes().len()"
              count = text.count(old)
              if count != 2:
                  raise SystemExit(f"{path}: expected two needless as_bytes calls, found {count}")
              path.write_text(text.replace(old, "value.len()"))
          PY
      - name: Format and validate every Rust target
        working-directory: zed-lib
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          cargo test --locked --test conformance
          cargo run --locked --example generate_fuzz_corpus
          git diff --exit-code conformance/
      - name: Commit canonical formatting and remove the one-shot carrier
        working-directory: zed-lib
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-format-account-control-plane.yml
          git add src/rust-orm
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(DEN-2788): format and validate account control plane'
          git push origin HEAD:feat/den-2788-account-control-plane-ops
