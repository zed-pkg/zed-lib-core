name: format registry data plane

on:
  push:
    branches:
      - agent/den-2788-registry-data-plane
    paths:
      - .github/workflows/format-registry-data-plane.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/den-2788-registry-data-plane
          fetch-depth: 0
      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt
      - name: Format registry crate and commit exact output
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src/rust-orm/Cargo.toml --all
          git diff --check
          if git diff --quiet; then
            echo 'Registry sources are already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rust-orm
          git commit -m 'style(DEN-2788): apply canonical rustfmt output'
          git push origin HEAD:agent/den-2788-registry-data-plane
