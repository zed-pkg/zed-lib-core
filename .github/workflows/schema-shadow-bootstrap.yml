name: bootstrap clean schema shadow branch

on:
  push:
    branches:
      - agent/json-schema-orm-shadow-20260809
    paths:
      - .github/workflows/schema-shadow-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: schema-shadow-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: agent/json-schema-orm-shadow-20260809

      - name: Verify and decode reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          cat .schema-shadow-bootstrap/part-* > /tmp/zed-schema-shadow.b64
          echo 'cdfe16d17324fd40a5a4e1a3e5bc05aa966c1f15286b5f8c8ded17f402249588  /tmp/zed-schema-shadow.b64' | sha256sum -c -
          base64 --decode /tmp/zed-schema-shadow.b64 > /tmp/zed-schema-shadow.tar.gz
          echo '91077964b840b23fd30b467aa8a0079cb3bb7cc6fa2f390042008d949e5ae7a0  /tmp/zed-schema-shadow.tar.gz' | sha256sum -c -
          cp .schema-shadow-bootstrap/check-schema-shadow.mjs /tmp/check-schema-shadow.mjs
          echo '6d8a38946f35c9e81873949e24dfbce73369457c34c2ffab0c27e8ade4e7622e  /tmp/check-schema-shadow.mjs' | sha256sum -c -

      - name: Apply payload to clean branch
        shell: bash
        run: |
          set -euo pipefail
          target='agent/json-schema-orm-shadow-clean-20260809'
          git fetch origin "refs/heads/${target}:refs/remotes/origin/${target}"
          git switch --force-create "${target}" "origin/${target}"
          tar -xzf /tmp/zed-schema-shadow.tar.gz
          install -m 0755 /tmp/check-schema-shadow.mjs tools/check-schema-shadow.mjs
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/schema-shadow-codegen.mjs')
          source = path.read_text(encoding='utf-8')
          old = "  lines.push('];', '');"
          replacement = "  lines.push('];');"
          count = source.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly two descriptor EOF patterns, found {count}')
          path.write_text(source.replace(old, replacement), encoding='utf-8')
          PY
          test ! -e .schema-shadow-bootstrap
          test ! -e .github/workflows/schema-shadow-bootstrap.yml

      - name: Validate generated contract
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/schema-shadow-codegen.mjs
          node --check tools/check-schema-shadow.mjs
          node --check tests/schema-shadow.test.mjs
          node --test tests/schema-shadow.test.mjs
          node tools/schema-shadow-codegen.mjs
          node tools/schema-shadow-codegen.mjs --check
          node tools/check-schema-shadow.mjs
          while IFS= read -r file; do
            diff -u "$file" <(gofmt "$file")
          done < <(find generated/schema-orm-shadow -type f -name '*.go' -print | sort)

      - name: Publish one clean implementation commit
        shell: bash
        run: |
          set -euo pipefail
          target='agent/json-schema-orm-shadow-clean-20260809'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/schema-shadow.yml
          git add --all
          git diff --cached --check
          git commit -m 'feat: add JSON Schema cross-language ORM shadow contract'
          git push origin "HEAD:refs/heads/${target}"
