name: repair public intake registry desired state v1

on:
  push:
    branches:
      - feat/public-intake-persistence-v1
    paths:
      - .repair-public-intake-registry-v1-trigger

permissions:
  contents: write

concurrency:
  group: repair-public-intake-registry-v1
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/public-intake-persistence-v1
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Append reviewed forward DDL and retrigger full verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          registry = Path("src/rust-orm/sql/registry.sql")
          migration = Path("src/rust-orm/sql/2026-09-02-public-intake.sql")
          text = registry.read_text()
          if "create table if not exists zed_public_intake_submissions" not in text:
              registry.write_text(text.rstrip() + "\n\n" + migration.read_text().strip() + "\n")
          PY
          rm -f \
            .public-intake-v5-failure.txt \
            .github/workflows/repair-public-intake-registry-v1.yml \
            .repair-public-intake-registry-v1-trigger
          printf '2026-09-02T17:25:00Z\n' > .materialize-public-intake-v5-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git grep --cached -nE '(ghp_|github_pat_|lin_api_)[A-Za-z0-9_]+' -- .; then
            echo "credential-shaped material found in staged files" >&2
            exit 1
          fi
          git commit -m "fix(intake): append migration to registry desired state"
          git push origin HEAD:feat/public-intake-persistence-v1
