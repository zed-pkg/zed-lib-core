name: DEN-3495 refresh interface lock

on:
  push:
    branches:
      - feat/DEN-3495-align-git-cli-install-contract
    paths:
      - "src/rust/Cargo.toml"
      - ".github/workflows/den-3495-refresh-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/DEN-3495-align-git-cli-install-contract
          fetch-depth: 1
          persist-credentials: true
      - name: Refresh only the reviewed interface Git source in Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Cargo.lock")
          old = "3c54298fc7a8c1b2f9c1d74f588c6118b38f197e"
          new = "d11322f06ca6930ddcc34a745b4ef01e0b2bddc1"
          text = path.read_text()
          count = text.count(old)
          if count != 3:
              raise SystemExit(f"expected exactly 3 old interface SHA occurrences, found {count}")
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          cargo test --locked -p zed-lib
      - name: Commit the deterministic lock refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORESoftware automation"
          git config user.email "automation@oresoftware.com"
          git add Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore(DEN-3495): refresh interface lock pin"
          git push origin HEAD:feat/DEN-3495-align-git-cli-install-contract
