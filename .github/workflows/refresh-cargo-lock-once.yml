name: refresh-cargo-lock-once

on:
  workflow_dispatch:
  push:
    branches: ["feat/isomorphic-validation-v1-20260903"]
    paths: [".github/workflows/refresh-cargo-lock-once.yml"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Regenerate the root lockfile
        run: cargo generate-lockfile
      - name: Commit only the generator-owned lockfile
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "Cargo.lock already current"
            exit 0
          fi
          test "$changed" = "Cargo.lock"
          git config user.name "zed-pkg automation"
          git config user.email "zed-pkg-automation@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "fix(rust): refresh Cargo.lock for current toolchain"
          git push origin "HEAD:${GITHUB_REF_NAME}"
