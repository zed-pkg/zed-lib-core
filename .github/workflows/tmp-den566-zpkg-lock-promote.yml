# Temporary trusted-branch Zed lock promotion. Remove after .zpkg.lock is committed.
name: tmp-den566-zpkg-lock-promote
on:
  push:
    branches: [den-566-ores-locks-adoption]
    paths:
      - '.github/workflows/tmp-den566-zpkg-lock-promote.yml'
      - '.zpkg.toml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: den-566-ores-locks-adoption
          persist-credentials: true
      - name: Assert trusted branch
        run: test "$(git branch --show-current)" = "den-566-ores-locks-adoption"
      - name: Install pinned Zed CLI v0.3.0
        shell: bash
        env:
          ZED_SHA256: f87576bc289e43ed647902527e7be70566445d2f1fd11249f067ab35547d4b8a
          ZED_URL: https://github.com/zed-pkg/zed-cli/releases/download/v0.3.0/zed-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zed.tar.gz"
          out="$RUNNER_TEMP/zed-release"
          curl --fail --location --retry 3 --retry-all-errors "$ZED_URL" --output "$archive"
          printf '%s  %s\n' "$ZED_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$out" "$HOME/.local/bin"
          tar -xzf "$archive" -C "$out"
          zed_bin="$(find "$out" -type f -name zed -perm -111 -print -quit)"
          test -n "$zed_bin"
          install -m 0755 "$zed_bin" "$HOME/.local/bin/zed"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Generate and validate Zed lock
        env:
          ZED_PKG_INTERACTIVE: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          zed --version
          zed install
          test -f .zpkg.lock
          test -z "$(git diff --name-only -- . ':!.zpkg.lock')"
      - name: Commit only .zpkg.lock
        run: |
          set -euo pipefail
          git add .zpkg.lock
          test "$(git diff --cached --name-only)" = ".zpkg.lock"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'DEN-566 generate Zed dependency lock'
          git push origin HEAD:den-566-ores-locks-adoption
