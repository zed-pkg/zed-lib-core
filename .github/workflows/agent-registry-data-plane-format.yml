name: agent registry data-plane format and verification

on:
  push:
    branches:
      - agent/den-2788-registry-data-plane
    paths:
      - .github/workflows/agent-registry-data-plane-format.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-registry-data-plane-format
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/den-2788-registry-data-plane
          path: zed-lib
          fetch-depth: 0

      - name: Check out immutable polyglot interfaces sibling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-interfaces
          ref: 6ad1ad3c0584a60778bf0d451d9d091ad90e6c0c
          path: zed-interfaces
          persist-credentials: false
          show-progress: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Format and verify all Rust surfaces
        working-directory: zed-lib
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo clippy --locked --manifest-path src/rust-orm/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path src/rust-orm/Cargo.toml --all-targets
          cargo test --locked --manifest-path src/rust-orm/Cargo.toml --all-targets --all-features
          cargo test --locked --manifest-path src/rust-orm/Cargo.toml --doc

      - name: Commit formatter output and remove this helper
        working-directory: zed-lib
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-registry-data-plane-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rust-orm/registry
          git diff --cached --check
          git commit -m 'style(DEN-2788): format the canonical registry data plane'
          git push origin HEAD:agent/den-2788-registry-data-plane
