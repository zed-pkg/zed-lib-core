name: Embedding dimension regression

on:
  pull_request:
    paths:
      - src/rust-orm/registry/search.rs
      - src/rust-orm/registry/validation.rs
      - tests/embedding-upsert-dimensions.test.mjs
      - .github/workflows/embedding-dimension-regression.yml
  push:
    branches: [main]
    paths:
      - src/rust-orm/registry/search.rs
      - src/rust-orm/registry/validation.rs
      - tests/embedding-upsert-dimensions.test.mjs
      - .github/workflows/embedding-dimension-regression.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedding-dimensions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          # Disposable test-only service, never a production database.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute the runtime upsert SQL against temporary PostgreSQL tables
        env:
          EMBEDDING_REQUIRE_POSTGRES: '1'
          EMBEDDING_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: |
          command -v node
          command -v psql
          node --test tests/embedding-upsert-dimensions.test.mjs
