name: tmp-den566-lock-refresh
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-den566-lock-refresh.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.zpkg.toml'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Generate exact lock graph
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo metadata --locked --no-deps >/dev/null
          printf 'LOCKFILE_BASE64='
          base64 -w0 Cargo.lock
          printf '\n'
