name: materialize public intake persistence v5

on:
  push:
    branches:
      - feat/public-intake-persistence-v1
    paths:
      - .materialize-public-intake-v5-trigger

permissions:
  contents: write

concurrency:
  group: materialize-public-intake-v5
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/public-intake-persistence-v1
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Materialize, generate, and verify
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/public-intake-v5.log"
          set +e
          (
            set -euo pipefail
            python3 <<'PY'
          from pathlib import Path
          import subprocess

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing expected {label} anchor")
              return text.replace(old, new, 1)

          public_intake = Path("src/rust-orm/public_intake.rs")
          text = public_intake.read_text()
          text = replace_once(
              text,
              '#[derive(Clone, Debug, PartialEq, Eq)]\npub struct NewPublicIntakeSubmission',
              '#[derive(Clone, PartialEq, Eq)]\npub struct NewPublicIntakeSubmission',
              "redacted Debug derive",
          )
          debug_impl = '''impl fmt::Debug for NewPublicIntakeSubmission {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter
                      .debug_struct("NewPublicIntakeSubmission")
                      .field("request_id", &self.request_id)
                      .field("kind", &self.kind)
                      .field("source_host", &self.source_host)
                      .field("sensitive_fields", &"[REDACTED]")
                      .field("consented_at", &self.consented_at)
                      .field("marketing_consent", &self.marketing_consent)
                      .finish()
              }
          }

          '''
          text = replace_once(
              text,
              "impl NewPublicIntakeSubmission {",
              debug_impl + "impl NewPublicIntakeSubmission {",
              "submission implementation",
          )
          public_intake.write_text(text)

          cargo = Path("src/rust-orm/Cargo.toml")
          text = cargo.read_text()
          text = replace_once(
              text,
              'zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "7d31f80c255c139bd61118f408b435bff24ab668" }',
              'zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "70508770bc76bb4ea59a2e6da57a3c416044e96c" }',
              "zed-interfaces intake-contract pin",
          )
          cargo.write_text(text)

          library = Path("src/rust-orm/lib.rs")
          text = library.read_text()
          text = replace_once(
              text,
              '#[cfg(feature = "read-write")]\npub mod write;\n',
              '#[cfg(feature = "read-write")]\npub mod write;\n#[cfg(feature = "read-write")]\npub mod public_intake;\n',
              "public-intake module gate",
          )
          text = replace_once(
              text,
              '    DEPENDENCY_GRAPH_MIGRATION_PATH, ORG_SCHEMA, REGISTRY_DDL_BLOB_SHA, REGISTRY_DDL_PATH,\n',
              '    DEPENDENCY_GRAPH_MIGRATION_PATH, ORG_SCHEMA, PUBLIC_INTAKE_MIGRATION_BLOB_SHA,\n    PUBLIC_INTAKE_MIGRATION_IDENTITY_SUFFIX, PUBLIC_INTAKE_MIGRATION_PATH,\n    REGISTRY_DDL_BLOB_SHA, REGISTRY_DDL_PATH,\n',
              "public-intake schema exports",
          )
          library.write_text(text)

          migration_sql_path = Path("src/rust-orm/sql/2026-09-02-public-intake.sql")
          migration_sql = migration_sql_path.read_text().strip()
          registry = Path("src/rust-orm/sql/registry.sql")
          registry_text = registry.read_text()
          if "create table if not exists zed_public_intake_submissions" not in registry_text:
              marker = "\nCOMMIT;"
              index = registry_text.rfind(marker)
              if index < 0:
                  raise SystemExit("registry.sql has no final COMMIT anchor")
              registry_text = (
                  registry_text[:index].rstrip()
                  + "\n\n"
                  + migration_sql
                  + "\n"
                  + registry_text[index:]
              )
              registry.write_text(registry_text)

          migration_blob = subprocess.check_output(
              ["git", "hash-object", str(migration_sql_path)], text=True
          ).strip()
          registry_blob = subprocess.check_output(
              ["git", "hash-object", str(registry)], text=True
          ).strip()

          schema = Path("src/rust-orm/schema.rs")
          text = schema.read_text()
          text = replace_once(
              text,
              'pub const REGISTRY_DDL_BLOB_SHA: &str = "c0869ca29c10e1c77bd9d9b8236fc61eac826ab9";',
              f'pub const REGISTRY_DDL_BLOB_SHA: &str = "{registry_blob}";',
              "registry desired-state blob",
          )
          public_constants = f'''/// Package-local forward migration for encrypted public commercial intake.
          pub const PUBLIC_INTAKE_MIGRATION_PATH: &str =
              "src/rust-orm/sql/2026-09-02-public-intake.sql";

          /// Immutable blob identity of the public-intake forward migration.
          pub const PUBLIC_INTAKE_MIGRATION_BLOB_SHA: &str = "{migration_blob}";

          /// Ledger suffix for the first public-intake migration.
          ///
          /// Unlike the imported 2026-08-11 migrations, this package-owned migration
          /// uses its authored Git blob directly as the immutable ledger identity.
          pub const PUBLIC_INTAKE_MIGRATION_IDENTITY_SUFFIX: &str =
              PUBLIC_INTAKE_MIGRATION_BLOB_SHA;

          '''
          text = replace_once(
              text,
              "// Compatibility aliases retained for existing Rust consumers.",
              public_constants + "// Compatibility aliases retained for existing Rust consumers.",
              "public-intake schema identity",
          )
          schema.write_text(text)

          migrations = Path("src/rust-orm/migrations.rs")
          text = migrations.read_text()
          text = replace_once(
              text,
              "    SHARED_DEFS_REGISTRY_SEGMENT, VISIBILITY_IMMUTABILITY_MIGRATION_IDENTITY_SUFFIX,\n",
              "    PUBLIC_INTAKE_MIGRATION_IDENTITY_SUFFIX, SHARED_DEFS_REGISTRY_SEGMENT,\n    VISIBILITY_IMMUTABILITY_MIGRATION_IDENTITY_SUFFIX,\n",
              "migration identity import",
          )
          text = replace_once(
              text,
              'const VISIBILITY_IMMUTABILITY_SQL: &str =\n    include_str!("sql/2026-08-11-public-visibility-is-permanent.sql");\n',
              'const VISIBILITY_IMMUTABILITY_SQL: &str =\n    include_str!("sql/2026-08-11-public-visibility-is-permanent.sql");\nconst PUBLIC_INTAKE_SQL: &str = include_str!("sql/2026-09-02-public-intake.sql");\n',
              "public-intake SQL include",
          )
          text = replace_once(
              text,
              "/// Return the current registry migration identity.\n",
              '''/// Version for the package-owned public-intake migration.
          pub fn public_intake_version() -> String {
              format!(
                  "registry-public-intake@{PUBLIC_INTAKE_MIGRATION_IDENTITY_SUFFIX}"
              )
          }

          /// Return the current registry migration identity.
          ''',
              "public-intake migration version",
          )
          text = replace_once(
              text,
              "    visibility_immutability_version()\n",
              "    public_intake_version()\n",
              "current registry version",
          )
          text = replace_once(
              text,
              "    VisibilityImmutability,\n",
              "    VisibilityImmutability,\n    PublicIntake,\n",
              "migration enum variant",
          )
          text = replace_once(
              text,
              "    const ORDERED: [Self; 3] = [\n        Self::HistoricalBase,\n        Self::DependencyGraph,\n        Self::VisibilityImmutability,\n    ];\n",
              "    const ORDERED: [Self; 4] = [\n        Self::HistoricalBase,\n        Self::DependencyGraph,\n        Self::VisibilityImmutability,\n        Self::PublicIntake,\n    ];\n",
              "ordered migrations",
          )
          text = replace_once(
              text,
              "            Self::VisibilityImmutability => visibility_immutability_version(),\n",
              "            Self::VisibilityImmutability => visibility_immutability_version(),\n            Self::PublicIntake => public_intake_version(),\n",
              "migration version dispatch",
          )
          text = replace_once(
              text,
              "            Self::VisibilityImmutability => VISIBILITY_IMMUTABILITY_SQL,\n",
              "            Self::VisibilityImmutability => VISIBILITY_IMMUTABILITY_SQL,\n            Self::PublicIntake => PUBLIC_INTAKE_SQL,\n",
              "migration SQL dispatch",
          )
          text = text.replace(
              "            RegistryMigration::VisibilityImmutability,\n        ]);",
              "            RegistryMigration::VisibilityImmutability,\n            RegistryMigration::PublicIntake,\n        ]);",
          )
          text = text.replace(
              "            RegistryMigration::VisibilityImmutability,\n        ]\n        .into_iter()",
              "            RegistryMigration::VisibilityImmutability,\n            RegistryMigration::PublicIntake,\n        ]\n        .into_iter()",
          )
          text = replace_once(
              text,
              "        let visibility = visibility_immutability_version();\n        assert!(graph.ends_with(DEPENDENCY_GRAPH_MIGRATION_IDENTITY_SUFFIX));\n        assert!(visibility.ends_with(VISIBILITY_IMMUTABILITY_MIGRATION_IDENTITY_SUFFIX));\n        assert_ne!(graph, visibility);\n        assert_eq!(registry_version(), visibility);\n",
              "        let visibility = visibility_immutability_version();\n        let intake = public_intake_version();\n        assert!(graph.ends_with(DEPENDENCY_GRAPH_MIGRATION_IDENTITY_SUFFIX));\n        assert!(visibility.ends_with(VISIBILITY_IMMUTABILITY_MIGRATION_IDENTITY_SUFFIX));\n        assert!(intake.ends_with(PUBLIC_INTAKE_MIGRATION_IDENTITY_SUFFIX));\n        assert_ne!(graph, visibility);\n        assert_ne!(visibility, intake);\n        assert_ne!(graph, intake);\n        assert_eq!(registry_version(), intake);\n",
              "migration identity test",
          )
          migrations.write_text(text)
          PY

            cargo update -p zed-interfaces
            cargo fmt --all
            cargo fmt --all -- --check
            cargo check --workspace --all-targets --all-features
            cargo test --workspace --all-targets --all-features
            cargo clippy --workspace --all-targets --all-features -- -D warnings

            npm ci --prefix schema-tooling --ignore-scripts --no-audit --no-fund
            npm --prefix schema-tooling run generate
            npm --prefix schema-tooling run ddl:roundtrip:write
            npm --prefix schema-tooling run contracts:write
            npm --prefix schema-tooling run generate:check
            npm --prefix schema-tooling run drift:check
            npm --prefix schema-tooling run ddl:roundtrip:check
            npm --prefix schema-tooling run contracts:check
            npm --prefix schema-tooling test

            git diff --check
          ) >"$log" 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            {
              echo "public-intake materialization v5 failed"
              echo
              tail -n 240 "$log"
            } | sed -E 's/(ghp_|github_pat_|lin_api_)[A-Za-z0-9_]+/[REDACTED]/g' > .public-intake-v5-failure.txt
            git add .public-intake-v5-failure.txt
            git commit -m "ci(intake): record materialization v5 failure" || true
            git push origin HEAD:feat/public-intake-persistence-v1
            cat "$log"
            exit "$status"
          fi

          rm -f .public-intake-v4-failure.txt .public-intake-v5-failure.txt
          rm -f \
            .github/workflows/materialize-public-intake.yml \
            .github/workflows/materialize-public-intake-v2.yml \
            .github/workflows/materialize-public-intake-v3.yml \
            .github/workflows/materialize-public-intake-v4.yml \
            .github/workflows/materialize-public-intake-v5.yml \
            .materialize-public-intake-trigger \
            .materialize-public-intake-v2-trigger \
            .materialize-public-intake-v3-trigger \
            .materialize-public-intake-v4-trigger \
            .materialize-public-intake-v5-trigger

          git add -A
          git diff --cached --check
          if git grep --cached -nE '(ghp_|github_pat_|lin_api_)[A-Za-z0-9_]+' -- .; then
            echo "credential-shaped material found in staged files" >&2
            exit 1
          fi
          git commit -m "feat(intake): materialize encrypted persistence boundary"
          git push origin HEAD:feat/public-intake-persistence-v1
          cat "$log"
