name: DEN-3091 one-shot rustfmt repair

on:
  push:
    branches:
      - agent/den-3091-private-lock-paths

permissions:
  contents: write

concurrency:
  group: den-3091-one-shot-rustfmt
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-3091-private-lock-paths
          persist-credentials: true
          fetch-depth: 1
      - name: Install the minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply deterministic formatting and push
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git add src/path_security.rs
          if git diff --cached --quiet; then
            echo 'Expected rustfmt changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(DEN-3091): apply rustfmt'
          git push origin HEAD:agent/den-3091-private-lock-paths
