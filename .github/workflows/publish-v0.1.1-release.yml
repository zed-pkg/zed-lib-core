name: Verify zed-lock v0.1.1 release

on:
  push:
    branches:
      - release/v0.1.1-artifacts

permissions:
  actions: read
  contents: read

jobs:
  verify:
    # The reviewed artifact embeds this workflow commit in its VCS metadata.
    # Later archival-branch synchronization must not compare a new package.
    if: github.sha == 'a7cf9f7a443f8f3c24a7df68f3ce1e56e6ef9ead'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: a0dc78d385bc3ab553d3027b427f5f1428239c9c
      ARTIFACT_ID: "8942659707"
    steps:
      - name: Download exact reviewed artifact with gh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reviewed
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > reviewed.zip
          unzip -q reviewed.zip -d reviewed
      - name: Download published release assets with gh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download v0.1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --dir release \
            --pattern 'zed-lock-0.1.1.crate' \
            --pattern 'zed-lock-0.1.1.crate.sha256'
      - name: Verify tag and both asset checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.1" --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq 2
          for directory in reviewed release; do
            crate="$directory/zed-lock-0.1.1.crate"
            checksum="$directory/zed-lock-0.1.1.crate.sha256"
            test -f "$crate"
            test -f "$checksum"
            expected="$(awk '{print $1}' "$checksum")"
            actual="$(sha256sum "$crate" | awk '{print $1}')"
            test "$actual" = "$expected"
            printf '%s crate sha256: %s\n' "$directory" "$actual"
          done
      - name: Compare unpacked reviewed and released package trees
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reviewed-tree release-tree
          tar -xzf reviewed/zed-lock-0.1.1.crate -C reviewed-tree
          tar -xzf release/zed-lock-0.1.1.crate -C release-tree
          diff -r --no-dereference reviewed-tree release-tree
          printf 'reviewed and released crate contents are byte-identical after unpacking\n'
