name: DEN-3321 schema-shadow recovery applicator

on:
  push:
    branches:
      - agent/den-3321-schema-shadow-hardening-20260809
    paths:
      - .github/workflows/den-3321-schema-shadow-recovery-apply.yml

permissions:
  contents: write

concurrency:
  group: den-3321-schema-shadow-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and apply exact recovered patch
        shell: bash
        run: |
          set -euo pipefail
          echo '66c38114d41d1ec69445ff0e56c4b02758dabc54b57c4c6c2410f50d57b0e627  .recovery/den-3321/schema-shadow-hardening.patch.gz.b64' | sha256sum -c -
          base64 --decode .recovery/den-3321/schema-shadow-hardening.patch.gz.b64 > "$RUNNER_TEMP/schema-shadow-hardening.patch.gz"
          gzip -dc "$RUNNER_TEMP/schema-shadow-hardening.patch.gz" > "$RUNNER_TEMP/schema-shadow-hardening.patch"
          echo "7db09182e39fa8e8283f10aca17159af6247fabc6bf6aa946845ef3376ad7d42  $RUNNER_TEMP/schema-shadow-hardening.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/schema-shadow-hardening.patch"
          git apply "$RUNNER_TEMP/schema-shadow-hardening.patch"

      - name: Validate JavaScript and generated adapters
        shell: bash
        run: |
          set -euo pipefail
          node --version
          go version
          node --check tools/schema-shadow-codegen.mjs
          node --check tools/check-schema-shadow.mjs
          node --check tests/schema-shadow.test.mjs
          node --test tests/schema-shadow.test.mjs
          node tools/schema-shadow-codegen.mjs --check
          while IFS= read -r file; do
            diff -u "$file" <(gofmt "$file")
          done < <(find generated/schema-orm-shadow -type f -name '*.go' -print | sort)

      - name: Verify SeaORM, SQL, and immutable interface locks
        shell: bash
        env:
          INTERFACE_REPOSITORY: zed-pkg/zed-interfaces
        run: |
          set -euo pipefail
          revision="$(node -p "JSON.parse(require('node:fs').readFileSync('schema/interfaces.lock.json', 'utf8')).revision")"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'interface lock must contain a full Git revision' >&2
            exit 1
          fi
          git init "$RUNNER_TEMP/zed-interfaces"
          git -C "$RUNNER_TEMP/zed-interfaces" remote add origin "https://github.com/$INTERFACE_REPOSITORY.git"
          git -C "$RUNNER_TEMP/zed-interfaces" fetch --depth=1 origin "$revision"
          node tools/check-schema-shadow.mjs . "$RUNNER_TEMP/zed-interfaces"

      - name: Commit validated recovery and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git rm .recovery/den-3321/schema-shadow-hardening.patch.gz.b64
          git rm .github/workflows/den-3321-schema-shadow-recovery-apply.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(DEN-3321): harden schema-shadow generator boundary'
          git push origin "HEAD:${GITHUB_REF_NAME}"
