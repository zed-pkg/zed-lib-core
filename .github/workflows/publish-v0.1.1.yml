name: publish immutable zed-lock v0.1.1

on:
  push:
    branches:
      - release/v0.1.1

permissions:
  contents: write

concurrency:
  group: publish-zed-lock-v0.1.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: 0.1.1
      RELEASE_TAG: v0.1.1
      RELEASE_COMMIT: a0dc78d385bc3ab553d3027b427f5f1428239c9c
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the exact reviewed merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a0dc78d385bc3ab553d3027b427f5f1428239c9c
          persist-credentials: false

      - name: Install the declared minimum Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy

      - name: Revalidate and package the exact release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          python3 scripts/check-package-contract.py
          python3 -m unittest -v tests/test_package_contract.py
          cargo fmt --all -- --check
          cargo test --all-targets -- --nocapture
          cargo clippy --all-targets -- -D warnings
          # This library intentionally does not commit Cargo.lock. Cargo creates
          # one while resolving test dependencies; remove only that generated
          # file before asserting the reviewed source tree is otherwise clean.
          rm -f Cargo.lock
          test -z "$(git status --porcelain)"
          cargo package
          mkdir -p dist
          cp "target/package/zed-lock-${RELEASE_VERSION}.crate" dist/
          sha256sum "dist/zed-lock-${RELEASE_VERSION}.crate" \
            > "dist/zed-lock-${RELEASE_VERSION}.crate.sha256"
          sha256sum --check "dist/zed-lock-${RELEASE_VERSION}.crate.sha256"

      - name: Publish the immutable GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v0.1.1
          target_commitish: a0dc78d385bc3ab553d3027b427f5f1428239c9c
          name: zed-lock v0.1.1
          body: |
            Hardened standalone release of the kernel-backed, event-driven
            locking crate extracted from zed-cli.

            - exact source commit: `a0dc78d385bc3ab553d3027b427f5f1428239c9c`
            - Rust MSRV: `1.88`
            - Linux, macOS, and Windows conformance passed before merge
            - package metadata, extraction provenance, and production no-polling
              contracts revalidated immediately before publication
            - attached crate checksum is generated and verified in this job

            This release does not alter or retarget `v0.1.0`.
          files: |
            dist/zed-lock-0.1.1.crate
            dist/zed-lock-0.1.1.crate.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
