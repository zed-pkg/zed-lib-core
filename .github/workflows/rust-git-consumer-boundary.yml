name: Rust git-consumer boundary

on:
  pull_request:
    paths:
      - "src/rust/**"
      - "Cargo.lock"
      - ".github/workflows/rust-git-consumer-boundary.yml"
  push:
    branches: [main]
    paths:
      - "src/rust/**"
      - "Cargo.lock"
      - ".github/workflows/rust-git-consumer-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-git-consumer-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  INTERFACES_SHA: 7d31f80dd8a310f218931165a3ad636a2f32b932
  LIB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-sha-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Verify the repository lock and native implementation
        run: cargo test --locked -p zed-lib
      - name: Compile a clean consumer against this exact Git commit
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/zed-lib-git-consumer"
          mkdir -p "$consumer/src"
          cat >"$consumer/Cargo.toml" <<EOF
          [package]
          name = "zed-lib-git-consumer"
          version = "0.0.0"
          edition = "2024"

          [dependencies]
          serde_json = "1"
          zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "$INTERFACES_SHA" }
          zed-lib = { git = "https://github.com/zed-pkg/zed-lib-core.git", rev = "$LIB_SHA" }
          EOF
          cat >"$consumer/src/main.rs" <<'EOF'
          fn main() {
              let metadata: zed_interfaces::registry::PackageMetadata =
                  serde_json::from_value(serde_json::json!({
                      "org": "acme",
                      "name": "kit",
                      "vcs": "git",
                      "repo_url": "https://github.com/acme/kit",
                      "description": null,
                      "latest": "1.2.0",
                      "versions": ["1.0.0", "1.2.0"],
                      "version_scheme": "semver",
                      "tags": []
                  }))
                  .expect("shared interface fixture");
              assert_eq!(zed_lib::resolve_version(&metadata, "^1.0").unwrap(), "1.2.0");
          }
          EOF
          cargo run --manifest-path "$consumer/Cargo.toml"
