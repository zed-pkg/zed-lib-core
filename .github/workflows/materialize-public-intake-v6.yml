name: materialize public intake persistence v6

on:
  push:
    branches:
      - feat/public-intake-persistence-v1
    paths:
      - .materialize-public-intake-v6-trigger

permissions:
  contents: write

concurrency:
  group: materialize-public-intake-v6
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/public-intake-persistence-v1
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Materialize, generate, verify, and publish
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/public-intake-v6.log"
          set +e
          (
            set -euo pipefail
            python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          CONTRACT_REV = "58572eb5d2cc00ec85c7793e606bab63ec9f5f3b"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing expected {label} anchor")
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, replacement: str, label: str, flags: int = 0) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"expected one {label} match, found {count}")
              return updated

          public_intake = Path("src/rust-orm/public_intake.rs")
          text = public_intake.read_text()
          text = text.replace(
              '#[derive(Clone, Debug, PartialEq, Eq)]\npub struct NewPublicIntakeSubmission',
              '#[derive(Clone, PartialEq, Eq)]\npub struct NewPublicIntakeSubmission',
              1,
          )
          if "impl fmt::Debug for NewPublicIntakeSubmission" not in text:
              debug_impl = '''impl fmt::Debug for NewPublicIntakeSubmission {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter
                      .debug_struct("NewPublicIntakeSubmission")
                      .field("request_id", &self.request_id)
                      .field("kind", &self.kind)
                      .field("source_host", &self.source_host)
                      .field("sensitive_fields", &"[REDACTED]")
                      .field("consented_at", &self.consented_at)
                      .field("marketing_consent", &self.marketing_consent)
                      .finish()
              }
          }

          '''
              text = replace_once(
                  text,
                  "impl NewPublicIntakeSubmission {",
                  debug_impl + "impl NewPublicIntakeSubmission {",
                  "submission implementation",
              )
          public_intake.write_text(text)

          cargo = Path("src/rust-orm/Cargo.toml")
          text = cargo.read_text()
          text = sub_once(
              text,
              r'zed-interfaces = \{ git = "https://github\.com/zed-pkg/zed-interfaces\.git", rev = "[0-9a-f]{40}" \}',
              f'zed-interfaces = {{ git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "{CONTRACT_REV}" }}',
              "zed-interfaces pin",
          )
          cargo.write_text(text)

          library = Path("src/rust-orm/lib.rs")
          text = library.read_text()
          if "pub mod public_intake;" not in text:
              text = replace_once(
                  text,
                  '#[cfg(feature = "read-write")]\npub mod write;\n',
                  '#[cfg(feature = "read-write")]\npub mod write;\n#[cfg(feature = "read-write")]\npub mod public_intake;\n',
                  "public-intake module gate",
              )
          if "PUBLIC_INTAKE_MIGRATION_PATH" not in text:
              marker = "\n/// Default consumers cannot import write symbols."
              exports = '''
          pub use schema::{
              PUBLIC_INTAKE_MIGRATION_BLOB_SHA, PUBLIC_INTAKE_MIGRATION_IDENTITY_SUFFIX,
              PUBLIC_INTAKE_MIGRATION_PATH,
          };
          '''
              text = replace_once(text, marker, exports + marker, "public-intake schema exports")
          library.write_text(text)

          registry = Path("src/rust-orm/sql/registry.sql")
          registry_text = registry.read_text()
          if "create table if not exists zed_public_intake_submissions" not in registry_text:
              raise SystemExit("registry desired state is missing the public-intake table")
          migration_sql_path = Path("src/rust-orm/sql/2026-09-02-public-intake.sql")
          migration_blob = subprocess.check_output(
              ["git", "hash-object", str(migration_sql_path)], text=True
          ).strip()
          registry_blob = subprocess.check_output(
              ["git", "hash-object", str(registry)], text=True
          ).strip()

          schema = Path("src/rust-orm/schema.rs")
          text = schema.read_text()
          text = sub_once(
              text,
              r'pub const REGISTRY_DDL_BLOB_SHA: &str = "[0-9a-f]{40}";',
              f'pub const REGISTRY_DDL_BLOB_SHA: &str = "{registry_blob}";',
              "registry desired-state identity",
          )
          if "PUBLIC_INTAKE_MIGRATION_PATH" not in text:
              constants = f'''/// Package-local forward migration for encrypted public commercial intake.
          pub const PUBLIC_INTAKE_MIGRATION_PATH: &str =
              "src/rust-orm/sql/2026-09-02-public-intake.sql";

          /// Immutable Git blob identity of the public-intake forward migration.
          pub const PUBLIC_INTAKE_MIGRATION_BLOB_SHA: &str = "{migration_blob}";

          /// Ordered-ledger suffix for the package-owned public-intake migration.
          pub const PUBLIC_INTAKE_MIGRATION_IDENTITY_SUFFIX: &str =
              PUBLIC_INTAKE_MIGRATION_BLOB_SHA;

          '''
              text = replace_once(
                  text,
                  "// Compatibility aliases retained for existing Rust consumers.",
                  constants + "// Compatibility aliases retained for existing Rust consumers.",
                  "public-intake schema constants",
              )
          schema.write_text(text)

          migrations = Path("src/rust-orm/migrations.rs")
          text = migrations.read_text()
          if "PUBLIC_INTAKE_MIGRATION_IDENTITY_SUFFIX" not in text:
              text = replace_once(
                  text,
                  '''    schema::{
                  DEPENDENCY_GRAPH_MIGRATION_IDENTITY_SUFFIX,
                  VISIBILITY_IMMUTABILITY_MIGRATION_IDENTITY_SUFFIX,
              },''',
                  '''    schema::{
                  DEPENDENCY_GRAPH_MIGRATION_IDENTITY_SUFFIX,
                  PUBLIC_INTAKE_MIGRATION_IDENTITY_SUFFIX,
                  VISIBILITY_IMMUTABILITY_MIGRATION_IDENTITY_SUFFIX,
              },''',
                  "migration identity imports",
              )
          if "const PUBLIC_INTAKE_SQL" not in text:
              text = replace_once(
                  text,
                  'const VISIBILITY_IMMUTABILITY_SQL: &str =\n    include_str!("sql/2026-08-11-public-visibility-is-permanent.sql");\n',
                  'const VISIBILITY_IMMUTABILITY_SQL: &str =\n    include_str!("sql/2026-08-11-public-visibility-is-permanent.sql");\nconst PUBLIC_INTAKE_SQL: &str = include_str!("sql/2026-09-02-public-intake.sql");\n',
                  "public-intake SQL include",
              )
          if "pub fn public_intake_version" not in text:
              text = replace_once(
                  text,
                  "/// Target version retained for compatibility with existing migration callers.\n",
                  '''/// Ledger identity for the encrypted public-intake upgrade.
          pub fn public_intake_version() -> String {
              format!("registry-public-intake@{PUBLIC_INTAKE_MIGRATION_IDENTITY_SUFFIX}")
          }

          /// Target version retained for compatibility with existing migration callers.
          ''',
                  "public-intake migration version",
              )
          text = text.replace(
              "    visibility_immutability_version()\n}",
              "    public_intake_version()\n}",
              1,
          )
          if "PublicIntake," not in text:
              text = replace_once(
                  text,
                  "    VisibilityImmutability,\n}",
                  "    VisibilityImmutability,\n    PublicIntake,\n}",
                  "migration enum variant",
              )
          text = replace_once(
              text,
              '''    const ORDERED: [Self; 3] = [
                  Self::HistoricalBase,
                  Self::DependencyGraph,
                  Self::VisibilityImmutability,
              ];''',
              '''    const ORDERED: [Self; 4] = [
                  Self::HistoricalBase,
                  Self::DependencyGraph,
                  Self::VisibilityImmutability,
                  Self::PublicIntake,
              ];''',
              "ordered migration series",
          )
          text = replace_once(
              text,
              "            Self::VisibilityImmutability => visibility_immutability_version(),\n",
              "            Self::VisibilityImmutability => visibility_immutability_version(),\n            Self::PublicIntake => public_intake_version(),\n",
              "migration version dispatch",
          )
          text = replace_once(
              text,
              "            Self::VisibilityImmutability => VISIBILITY_IMMUTABILITY_SQL,\n",
              "            Self::VisibilityImmutability => VISIBILITY_IMMUTABILITY_SQL,\n            Self::PublicIntake => PUBLIC_INTAKE_SQL,\n",
              "migration SQL dispatch",
          )

          identity_test = '''    #[test]
              fn every_forward_migration_has_an_independent_ledger_identity() {
                  let graph = dependency_graph_version();
                  let visibility = visibility_immutability_version();
                  let intake = public_intake_version();
                  assert!(graph.ends_with(DEPENDENCY_GRAPH_MIGRATION_IDENTITY_SUFFIX));
                  assert!(visibility.ends_with(VISIBILITY_IMMUTABILITY_MIGRATION_IDENTITY_SUFFIX));
                  assert!(intake.ends_with(PUBLIC_INTAKE_MIGRATION_IDENTITY_SUFFIX));
                  assert_eq!(registry_version(), intake);
                  assert_ne!(graph, visibility);
                  assert_ne!(graph, intake);
                  assert_ne!(visibility, intake);
                  assert_ne!(graph, BASE_REGISTRY_VERSION);
                  assert_ne!(visibility, BASE_REGISTRY_VERSION);
                  assert_ne!(intake, BASE_REGISTRY_VERSION);
              }

          '''
          text = sub_once(
              text,
              r'    #\[test\]\n    fn every_forward_migration_has_an_independent_ledger_identity\(\) \{.*?\n    \}\n\n',
              identity_test,
              "migration identity test",
              re.S,
          )
          old_forward = '''            vec![
                      MigrationStep::DependencyGraph,
                      MigrationStep::VisibilityImmutability
                  ]'''
          new_forward = '''            vec![
                      MigrationStep::DependencyGraph,
                      MigrationStep::VisibilityImmutability,
                      MigrationStep::PublicIntake,
                  ]'''
          if text.count(old_forward) != 3:
              raise SystemExit(f"expected three existing-base plan vectors, found {text.count(old_forward)}")
          text = text.replace(old_forward, new_forward)
          text = replace_once(
              text,
              "        assert_eq!(plan, vec![MigrationStep::DependencyGraph]);\n",
              "        assert_eq!(\n            plan,\n            vec![MigrationStep::DependencyGraph, MigrationStep::PublicIntake]\n        );\n",
              "visibility-ledger plan test",
          )
          text = replace_once(
              text,
              '            "zed_audit_log",\n',
              '            "zed_audit_log",\n            "zed_public_intake_submissions",\n',
              "owned table inventory",
          )
          if "the_public_intake_migration_is_encrypted_and_retry_safe" not in text:
              intake_test = '''    #[test]
              fn the_public_intake_migration_is_encrypted_and_retry_safe() {
                  assert!(PUBLIC_INTAKE_SQL.contains(
                      "create table if not exists zed_public_intake_submissions"
                  ));
                  assert!(PUBLIC_INTAKE_SQL.contains("create extension if not exists pgcrypto"));
                  assert!(PUBLIC_INTAKE_SQL.contains("encrypted_email bytea not null"));
                  assert!(PUBLIC_INTAKE_SQL.contains("encrypted_payload bytea not null"));
                  assert!(PUBLIC_INTAKE_SQL.contains("revoke all on table zed_public_intake_submissions from public"));
                  assert!(!PUBLIC_INTAKE_SQL.to_ascii_lowercase().contains("drop table"));
                  assert!(!PUBLIC_INTAKE_SQL.to_ascii_lowercase().contains("truncate"));
              }

          '''
              text = replace_once(
                  text,
                  "    #[test]\n    fn the_owned_segment_keeps_the_deployed_public_schema()",
                  intake_test + "    #[test]\n    fn the_owned_segment_keeps_the_deployed_public_schema()",
                  "public-intake migration safety test",
              )
          migrations.write_text(text)
          PY

            cargo update -p zed-interfaces
            cargo fmt --all
            cargo fmt --all -- --check
            cargo check --workspace --all-targets --all-features
            cargo test --workspace --all-targets --all-features
            cargo clippy --workspace --all-targets --all-features -- -D warnings

            npm ci --prefix schema-tooling --ignore-scripts --no-audit --no-fund
            npm --prefix schema-tooling run generate
            npm --prefix schema-tooling run ddl:roundtrip:write
            npm --prefix schema-tooling run contracts:write
            npm --prefix schema-tooling run generate:check
            npm --prefix schema-tooling run drift:check
            npm --prefix schema-tooling run ddl:roundtrip:check
            npm --prefix schema-tooling run contracts:check
            npm --prefix schema-tooling test
            git diff --check
          ) >"$log" 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            {
              echo "public-intake materialization v6 failed"
              echo
              tail -n 300 "$log"
            } | sed -E 's/(ghp_|github_pat_|lin_api_)[A-Za-z0-9_]+/[REDACTED]/g' > .public-intake-v6-failure.txt
            git add .public-intake-v6-failure.txt
            git commit -m "ci(intake): record materialization v6 failure" || true
            git push origin HEAD:feat/public-intake-persistence-v1
            cat "$log"
            exit "$status"
          fi

          rm -f .public-intake-v5-failure.txt .public-intake-v6-failure.txt
          rm -f \
            .github/workflows/materialize-public-intake.yml \
            .github/workflows/materialize-public-intake-v2.yml \
            .github/workflows/materialize-public-intake-v3.yml \
            .github/workflows/materialize-public-intake-v4.yml \
            .github/workflows/materialize-public-intake-v5.yml \
            .github/workflows/materialize-public-intake-v6.yml \
            .materialize-public-intake-trigger \
            .materialize-public-intake-v2-trigger \
            .materialize-public-intake-v3-trigger \
            .materialize-public-intake-v4-trigger \
            .materialize-public-intake-v5-trigger \
            .materialize-public-intake-v6-trigger

          git add -A
          git diff --cached --check
          if git grep --cached -nE '(ghp_|github_pat_|lin_api_)[A-Za-z0-9_]+' -- .; then
            echo "credential-shaped material found in staged files" >&2
            exit 1
          fi
          git commit -m "feat(intake): materialize encrypted persistence boundary"
          git push origin HEAD:feat/public-intake-persistence-v1
          cat "$log"
