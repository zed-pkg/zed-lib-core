name: DEN-3282 repin lock

on:
  push:
    branches: ["den-3282-align-interfaces-aa0f87be-20260918"]
    paths:
      - "src/rust/Cargo.toml"
      - ".github/workflows/den-3282-repin-lock.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: den-3282-align-interfaces-aa0f87be-20260918
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Generate and certify the native lock
        run: |
          set -euo pipefail
          grep -F 'rev = "aa0f87be13cdf003600b42a6088202898fcbae8d"' src/rust/Cargo.toml
          cargo update -p 'zed-interfaces 0.1.0' --precise aa0f87be13cdf003600b42a6088202898fcbae8d || \
            cargo update -p zed-interfaces --precise aa0f87be13cdf003600b42a6088202898fcbae8d
          cargo fmt --all -- --check
          cargo test --locked -p zed-lib
          cargo clippy --locked -p zed-lib --all-targets -- -D warnings
          grep -F 'aa0f87be13cdf003600b42a6088202898fcbae8d' Cargo.lock
      - name: Commit only resolver output and remove this workflow
        run: |
          set -euo pipefail
          rm .github/workflows/den-3282-repin-lock.yml
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -vE '^ M Cargo.lock$|^ D \.github/workflows/den-3282-repin-lock\.yml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected generated delta:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git config user.name "ORESoftware"
          git config user.email "alex@oresoftware.com"
          git add Cargo.lock .github/workflows/den-3282-repin-lock.yml
          git commit -m "DEN-3282: regenerate lib lock for interface authority"
          git push origin HEAD:den-3282-align-interfaces-aa0f87be-20260918
