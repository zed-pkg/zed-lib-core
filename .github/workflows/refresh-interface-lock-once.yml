name: Refresh interface lock once

on:
  push:
    branches:
      - fix/interfaces-type-identity-20260911

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/interfaces-type-identity-20260911
          fetch-depth: 1
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.98.1'
      - name: Regenerate only the admitted zed-interfaces edge
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p zed-interfaces --precise 0c2ffa7be791a44c8aa2a69ab4b1ea87aab4729c
          changed="$(git diff --name-only)"
          test "$changed" = "Cargo.lock" || {
            printf 'unexpected generated files:\n%s\n' "$changed" >&2
            exit 1
          }
          cargo test --locked -p zed-lib
      - name: Commit resolver output
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain Cargo.lock)" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git diff --cached --name-only | grep -Fx 'Cargo.lock'
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '1'
          git commit -m 'chore: refresh zed-interfaces lock identity'
          git push origin HEAD:fix/interfaces-type-identity-20260911
