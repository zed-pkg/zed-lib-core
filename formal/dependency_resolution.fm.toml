# Bounded formal contract for the shared Rust/TypeScript/Dart resolver.
schema_version = 1
project = "zed-lib-core"
model = "dependency-resolution-v1"
language = "quint"
spec = "formal/dependency_resolution.qnt"
main = "dependency_resolution"
init = "init"
step = "step"
invariants = ["resolution_safety"]
witnesses = [
  "semver_selection_reached",
  "calver_selection_reached",
  "opaque_range_rejected_reached",
  "malformed_requirement_rejected_reached",
  "no_versions_reached",
  "unsatisfied_reached",
  "missing_dependency_fails_closed_reached",
  "cycle_fails_closed_reached",
  "deterministic_replay_reached",
]

[toolchain]
quint = "0.32.0"
java = ">=17"
node = "22"
npx = "npx"

[execution]
timeout_seconds = 600
max_output_bytes = 8388608
artifacts_dir = ".formal-artifacts/dependency-resolution"

[simulation]
backend = "typescript"
max_samples = 10000
max_steps = 24

[verification]
backend = "tlc"
exhaustive_finite_model = true
